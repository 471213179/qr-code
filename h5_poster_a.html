<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>扫描查看最新内容</title>
    <style>
        body { text-align:center; padding:40px 20px; font-family:sans-serif; background:#f0f2f5; }
        .box { background:white; max-width:320px; margin:auto; padding:30px; border-radius:15px; box-shadow:0 5px 20px rgba(0,0,0,0.08); }
        img { width:250px; height:250px; display:block; margin:20px auto; border:1px solid #eee; }
        .tip { color:#666; font-size:14px; margin:15px 0; line-height:1.5; }
    </style>
</head>
<body>
    <div class="box">
        <h2>欢迎扫码</h2>
        <p class="tip">长按下图二维码，在弹出菜单中选择「识别图中二维码」即可查看最新内容。</p >
        < img src="https://raw.githubusercontent.com/471213179/qr-code/main/poster_a.jpg" alt="动态二维码">
        <p class="tip"><strong>提示：</strong>如果长按无反应，请尝试保存图片后，在微信内从相册选择识别。</p >
        <p style="color:#999; font-size:12px; margin-top:25px;">内容实时更新 | 安全可信</p >
    </div>
</body>
</html>
